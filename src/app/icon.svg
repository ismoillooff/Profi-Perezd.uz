<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Favicon. The wordmark is illegible at 16px, so the mark alone carries
       it: the truck silhouette on the brand's clay, which stays readable in a
       crowded tab strip where a white-on-white glyph would disappear. -->
