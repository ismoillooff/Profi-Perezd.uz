  <g stroke="#ffffff" stroke-width="4.2" fill="none" stroke-linejoin="round">
    <path d="M11 18h24v18H11z"/>
    <path d="M35 24h7l7 6.4V36H35z"/>
  </g>
  <circle cx="21" cy="42" r="4.6" stroke="#ffffff" stroke-width="4.2" fill="#c2521f"/>
  <circle cx="43" cy="42" r="4.6" stroke="#ffffff" stroke-width="4.2" fill="#c2521f"/>
</svg>
